name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      # Unsigned when no signing env is present, so fork PRs exercise this too.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: worddrill-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  instrumented-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon

  # Release APKs must stay signed with the same certificate so existing
  # installs can upgrade in place. Builds the release APK at HEAD and at the
  # previous commit with the same signing secrets and fails if the certificate
  # fingerprints differ. Blind spot by design: a rotated keystore secret is not
  # detectable here because both builds use the secret's current value.
  release-fingerprint-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/worddrill-release.jks"

      - name: Build release APK at HEAD and record fingerprint
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/worddrill-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::HEAD release APK is not signed (expected app-release.apk)"
            ls app/build/outputs/apk/release/
            exit 1
          fi
          keytool -printcert -jarfile "$APK" | grep 'SHA256:' | tee "$RUNNER_TEMP/head.sha256"

      - name: Build release APK at HEAD~1 and compare fingerprints
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/worddrill-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -o pipefail
          rm -rf app/build/outputs/apk/release
          git checkout --quiet HEAD~1
          ./gradlew :app:assembleRelease --no-daemon
          OUT=app/build/outputs/apk/release
          if [ -f "$OUT/app-release.apk" ]; then
            keytool -printcert -jarfile "$OUT/app-release.apk" | grep 'SHA256:' | tee "$RUNNER_TEMP/prev.sha256"
            if ! diff -u "$RUNNER_TEMP/head.sha256" "$RUNNER_TEMP/prev.sha256"; then
              echo "::error::Release signing certificate changed between HEAD~1 and HEAD"
              exit 1
            fi
            echo "Release certificate fingerprints match between HEAD~1 and HEAD."
          elif [ -f "$OUT/app-release-unsigned.apk" ]; then
            echo "::warning::HEAD~1 produced an unsigned release APK (commit predates release signing); skipping comparison."
          else
            echo "::error::HEAD~1 produced no release APK"
            ls "$OUT"
            exit 1
          fi
