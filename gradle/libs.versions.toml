# Stable version line verified on 2026-07-23 (compatible with AGP 8.13.x)
[versions]
agp = "8.13.2"
kotlin = "2.4.10"
ksp = "2.3.10"
coreKtx = "1.16.0"
lifecycle = "2.9.4"
activityCompose = "1.10.1"
composeBom = "2026.06.01"
navigationCompose = "2.9.4"
hilt = "2.60.1"
hiltExt = "1.3.0"
room = "2.8.4"
datastore = "1.1.7"
coroutines = "1.9.0"
truth = "1.4.4"
junit = "4.13.2"
androidxTestExtJunit = "1.2.1"
espresso = "3.6.1"
# Ticket #24: AndroidX SplashScreen. API 31+ forces a system splash. This library
# sets the splash icon to a transparent drawable, which looks like a plain solid
# background, so the custom Compose launch animation takes over with no
# "big logo first, then animation" step.
splashscreen = "1.0.1"
# Ticket #21: JVM unit tests need an XmlPullParser implementation (the Android framework
# provides one on-device; kxml2 is required on the JVM). testImplementation only, never
# ships in the production APK.
kxml2 = "2.3.0"
xmlpull = "1.1.3.1"
# Ticket #21: PDF table extraction. tabula-java depends on PDFBox 2.0.x (which uses
# java.awt, absent on Android) and has been unmaintained since 2021; use PdfBox-Android
# instead (an Android port of PDFBox 2.0.27).
pdfboxAndroid = "2.0.27.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-hilt-navigation-compose = { group = "androidx.hilt", name = "hilt-navigation-compose", version.ref = "hiltExt" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
# Ticket #21: XmlPullParser implementation for JVM unit tests (framework-provided on Android)
kxml2 = { group = "net.sf.kxml", name = "kxml2", version.ref = "kxml2" }
xmlpull = { group = "xmlpull", name = "xmlpull", version.ref = "xmlpull" }
# Ticket #21: PDF table extraction (Android port of PDFBox)
pdfbox-android = { group = "com.tom-roush", name = "pdfbox-android", version.ref = "pdfboxAndroid" }
# Ticket #24: core-splashscreen (API 23+ compatibility layer)
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "splashscreen" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
# Note: the Hilt Gradle plugin is intentionally NOT enabled (its 2.59+ line requires AGP 9,
# conflicting with this project's AGP 8.13.x). Hilt works via ksp(hilt-compiler) plus
# manually extending the generated class. See WordDrillApp / MainActivity.
